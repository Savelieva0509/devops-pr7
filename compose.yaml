name: devops7
services:
  app:
    image: ${IMAGE_NAME:?IMAGE_NAME не задано}:${IMAGE_TAG:?IMAGE_TAG не задано}
    container_name: ${CONTAINER_NAME:-devops7-app}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATA_DIR: ${DATA_DIR:-/app/data}
    restart: unless-stopped
